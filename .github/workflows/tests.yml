name: Tests

permissions:
  contents: read

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: setup.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run lint checks
        run: ruff check .

      - name: Run type checks
        run: mypy kftools

      - name: Run tests with coverage
        run: coverage run -m pytest -q

      - name: Enforce coverage threshold
        run: coverage report

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install declared minimum dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            'ete4==4.1.1' \
            'numpy==1.23.0' \
            'pandas==1.5.0' \
            'matplotlib==3.6.0' \
            'scipy==1.9.0' \
            'statsmodels==0.13.5' \
            'pytest>=8'
          pip install --no-deps -e .

      - name: Run tests against minimum dependencies
        run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine check dist/*

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit resolved runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pip-audit
          pip-audit
