name: Tests

permissions:
  contents: read

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/python
        with:
          python-version: "3.14"
      - name: Check latest dependencies, types, lint, and branch coverage
        run: make check-latest PYTHON_LATEST=python

  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/python
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Run compatibility tests
        run: make test
      - name: Build, test the installed wheel, and audit runtime dependencies
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install -e '.[release]'
          make build wheel-smoke audit

  minimum-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/python
        with:
          python-version: "3.10"
          dependency-set: minimum
      - name: Test declared minimum dependencies in a clean environment
        run: make check-minimum PYTHON_MINIMUM=python
