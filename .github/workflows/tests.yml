name: Tests

permissions:
  contents: read

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test and quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,quality]'

      - name: Run lint checks
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run type checks
        run: mypy kftools

      - name: Run tests with branch coverage
        run: coverage run -m pytest -q

      - name: Enforce coverage threshold
        run: coverage report

  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Run compatibility tests
        run: python -m pytest -q

  minimum-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/minimum-python310.txt

      - name: Install declared minimum dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/minimum-python310.txt -e '.[test]'

      - name: Run tests against minimum dependencies
        run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          twine check dist/*

      - name: Install and import the built wheel
        run: |
          python -m venv /tmp/kftools-wheel-smoke
          /tmp/kftools-wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/kftools-wheel-smoke/bin/python -c "import kftools; from kftools import kfexpression, kfog, kfphylo, kfplot, kfseq, kfspecies, kfstat, kfutil; print(kftools.__version__)"

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Audit project runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          pip-audit --strict .
