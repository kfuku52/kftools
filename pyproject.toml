[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kftools"
dynamic = ["version"]
description = "Utilities for evolutionary genomics, phylogenetics, expression analysis, statistics, sequences, and plotting"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kenji Fukushima", email = "kfuku52@gmail.com" },
]
keywords = ["bioinformatics", "evolutionary-genomics", "phylogenetics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "ete4>=4.1.1",
    "matplotlib>=3.6",
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "statsmodels>=0.13.5",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]
quality = [
    "coverage[toml]>=7",
    "mypy>=1.10",
    "ruff>=0.8",
]
release = [
    "build>=1.2",
    "pip-audit>=2.7",
    "twine>=5",
]
dev = [
    "build>=1.2",
    "coverage[toml]>=7",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "pytest>=8",
    "ruff>=0.8",
    "twine>=5",
]

[project.urls]
Homepage = "https://github.com/kfuku52/kftools"
Issues = "https://github.com/kfuku52/kftools/issues"
Repository = "https://github.com/kfuku52/kftools.git"

[tool.setuptools.dynamic]
version = { attr = "kftools.__version__" }

[tool.setuptools.packages.find]
include = ["kftools*"]

[tool.setuptools.package-data]
kftools = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
filterwarnings = ["error"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["kftools"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["B", "C4", "C90", "E4", "E7", "E9", "F", "I", "PERF", "SIM", "UP"]

[tool.ruff.lint.mccabe]
# Validation-heavy plotting functions form the current baseline. CI prevents
# further growth while they are progressively decomposed.
max-complexity = 10

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
